name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86-64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build wfm.exe (x86-64)
        run: |
          set -euxo pipefail
          CC=x86_64-w64-mingw32-gcc
          RC=x86_64-w64-mingw32-windres
          INCLUDES="-I./include -I./include/libcdio"
          CFLAGS="-O2 -std=c99 -DUNICODE -D_UNICODE -DCOBJMACROS -DWINVER=0x0600 -Wall"
          SRCS="main theme config favorites diff content_view toolbar navbar treeview sizebar statusbar file_node file_actions input_dialog"
          mkdir -p obj
          for f in $SRCS; do
            $CC $CFLAGS $INCLUDES -c "src/$f.c" -o "obj/$f.o"
          done
          $RC $INCLUDES -I./res -i res/resource.rc -o obj/resource.o
          $CC -o wfm.exe obj/*.o -s -lcomctl32 -lgdi32 -lole32 -loleaut32 -luuid -luxtheme -lshlwapi -lcrypt32 ./libcdio.dll -Wl,--subsystem,windows
          file wfm.exe

      - name: Package release zip
        run: |
          mkdir -p release
          cp wfm.exe libcdio.dll release/
          cd release && zip -r ../bfm-zh-x64.zip wfm.exe libcdio.dll && cd ..

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this tag version
            VERSION="${GITHUB_REF_NAME#v}"
            awk "/^## \\[?${VERSION//./\\.}\\]?/{flag=1;next} /^## /{flag=0} flag" CHANGELOG.md > release_notes.md
            if [ ! -s release_notes.md ]; then
              cat CHANGELOG.md > release_notes.md
            fi
          else
            echo "No CHANGELOG.md found. Release notes: ${GITHUB_REF_NAME}" > release_notes.md
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            bfm-zh-x64.zip
            wfm.exe
            libcdio.dll
          fail_on_unmatched_files: true
