name: Build Banner File Manager (x64)

# 构建 wfm.exe（x86-64 PE）
# push main + 所有 PR 都会构建验证；main 构建后自动更新 nightly 预发布

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 静态代码审查（cppcheck，error 阻断）
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq cppcheck 2>/dev/null || true
          echo "── 静态审查（error 级阻断）──"
          cppcheck --version
          # Why:  编译前的确定性缺陷检查（空指针/越界/未初始化/内存泄漏等）
          # What: 扫描 src/ + include/ 全部 C 代码
          # How:  删除本步骤即回退；--enable=error 只查确定性问题，误报率极低
          cppcheck --enable=error --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=unmatchedSuppression \
            --std=c99 -DUNICODE -D_UNICODE -DCOBJMACROS -DWINVER=0x0600 \
            -I include -I include/libcdio \
            src 2>&1 | tail -60
          echo "静态审查通过 ✓（无 error 级缺陷）"

      - name: Install mingw-w64 (x86-64) toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build wfm.exe (x86-64)
        run: |
          set -euxo pipefail
          CC=x86_64-w64-mingw32-gcc
          RC=x86_64-w64-mingw32-windres
          INCLUDES="-I./include -I./include/libcdio"
          CFLAGS="-O2 -std=c99 -DUNICODE -D_UNICODE -DCOBJMACROS -DWINVER=0x0600 -Wall"
          SRCS="main theme config favorites diff content_view toolbar navbar treeview sizebar statusbar file_node file_actions input_dialog"

          mkdir -p obj
          for f in $SRCS; do
            $CC $CFLAGS $INCLUDES -c "src/$f.c" -o "obj/$f.o"
          done

          # Resources (icons + manifest); needs both ./include (resource.h) and ./res (icons).
          $RC $INCLUDES -I./res -i res/resource.rc -o obj/resource.o

          # Link against the bundled x64 libcdio.dll (ISO-mount support), like upstream.
          $CC -o wfm.exe obj/*.o -s -lcomctl32 -lgdi32 -lole32 -loleaut32 -luuid -luxtheme -lshlwapi -lcrypt32 ./libcdio.dll -Wl,--subsystem,windows

          file wfm.exe
          ls -l wfm.exe libcdio.dll

      - name: Package build zip (with install scripts)
        run: |
          mkdir -p pkg
          cp wfm.exe libcdio.dll pkg/
          # 复制安装脚本和使用说明（如果存在）
          if [ -f scripts/install.bat ]; then cp scripts/install.bat pkg/; fi
          if [ -f scripts/uninstall.bat ]; then cp scripts/uninstall.bat pkg/; fi
          if [ -f "scripts/使用说明.txt" ]; then cp "scripts/使用说明.txt" pkg/; fi
          cd pkg && zip -r ../bfm-zh-x64.zip . && cd ..
          echo "=== zip contents ==="
          unzip -l bfm-zh-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfm-zh-x64
          path: bfm-zh-x64.zip

      # 仅 main 分支 push 时更新 nightly 预发布；PR 构建不发布（只验证）
      - name: Update nightly pre-release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build
          tag_name: nightly
          prerelease: true
          body: |
            Auto-built from commit ${{ github.sha }}.
            This is a pre-release for testing only.

            完整安装包（含 wfm.exe、libcdio.dll、install.bat、uninstall.bat、使用说明.txt）
          files: bfm-zh-x64.zip
          fail_on_unmatched_files: true
