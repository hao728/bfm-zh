name: Build Banner File Manager (x64)

# Phase 1: minimal x64 cut. Produces a universal wfm.exe (x86-64 PE) that runs in BOTH
# Bannerlator container arches — natively under Box64 in x86-64 containers, and via
# wowbox64 in arm64ec containers. arm64ec-native build is a later phase.

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (x86-64) toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build wfm.exe (x86-64)
        run: |
          set -euxo pipefail
          CC=x86_64-w64-mingw32-gcc
          RC=x86_64-w64-mingw32-windres
          INCLUDES="-I./include -I./include/libcdio"
          CFLAGS="-O2 -std=c99 -DUNICODE -D_UNICODE -DCOBJMACROS -DWINVER=0x0600 -Wall"
          SRCS="main theme config favorites diff content_view toolbar navbar treeview sizebar statusbar file_node file_actions input_dialog"

          mkdir -p obj
          for f in $SRCS; do
            $CC $CFLAGS $INCLUDES -c "src/$f.c" -o "obj/$f.o"
          done

          # Resources (icons + manifest); needs both ./include (resource.h) and ./res (icons).
          $RC $INCLUDES -I./res -i res/resource.rc -o obj/resource.o

          # Link against the bundled x64 libcdio.dll (ISO-mount support), like upstream.
          $CC -o wfm.exe obj/*.o -s -lcomctl32 -lgdi32 -lole32 -loleaut32 -luuid -luxtheme -lshlwapi -lcrypt32 -lmsimg32 ./libcdio.dll -Wl,--subsystem,windows

          file wfm.exe
          ls -l wfm.exe libcdio.dll

      - name: Fetch latest 7-Zip (auto official release)
        run: |
          set -euxo pipefail
          # 从 7-Zip 官方 GitHub 仓库自动获取最新版本号（26.03 → 文件名 7z2603-x64.exe）
          TAG=$(curl -s --max-time 20 https://api.github.com/repos/ip7z/7zip/releases/latest | grep '"tag_name"' | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          if [ -z "$TAG" ]; then TAG="26.03"; echo "API 获取失败，回退到 26.03"; fi
          VER=$(echo "$TAG" | tr -d '.')
          URL="https://github.com/ip7z/7zip/releases/download/${TAG}/7z${VER}-x64.exe"
          echo "下载 7-Zip ${TAG} (Winlator x64): $URL"
          curl -fL --retry 3 --max-time 120 -o "7z${VER}-x64.exe" "$URL"
          ls -l 7z*.exe

      - name: Package build zip (with install scripts)
        run: |
          mkdir -p pkg
          cp wfm.exe libcdio.dll pkg/
          # 复制 7-Zip 安装包（安装脚本会自动静默安装到 Z:\opt\apps\7-Zip）
          cp 7z*-x64.exe pkg/ 2>/dev/null || true
          # 复制安装脚本（根目录为新版）
          if [ -f 安装.bat ]; then cp 安装.bat pkg/; fi
          if [ -f 卸载还原.bat ]; then cp 卸载还原.bat pkg/; fi
          cd pkg && zip -r ../bfm-zh-x64.zip . && cd ..
          echo "=== zip contents ==="
          unzip -l bfm-zh-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfm-zh-x64
          path: bfm-zh-x64.zip

      - name: Update nightly pre-release
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build
          tag_name: nightly
          prerelease: true
          body: |
            Auto-built from commit ${{ github.sha }}.
            This is a pre-release for testing only.

            完整安装包（含 wfm.exe、libcdio.dll、install.bat、uninstall.bat、使用说明.txt）
          files: bfm-zh-x64.zip
          fail_on_unmatched_files: true
