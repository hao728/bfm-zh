name: cleanup-runs

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          def api(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      if resp.status == 204:
                          return None
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return {"error": e.code}

          # 1. 获取所有 runs
          all_runs = []
          for page in range(1, 6):
              data = api(f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}")
              if not data or "workflow_runs" not in data:
                  break
              all_runs.extend(data["workflow_runs"])
              if len(data["workflow_runs"]) < 100:
                  break

          print(f"找到 {len(all_runs)} 个 workflow runs")

          # 2. 确定要保留的：最近5个成功的 build 工作流
          build_success = [r for r in all_runs
                          if "Build Banner File Manager" in r["name"]
                          and r.get("conclusion") == "success"]
          build_success.sort(key=lambda r: r["created_at"], reverse=True)
          keep_ids = set(r["id"] for r in build_success[:5])
          print(f"保留最近5个成功构建: {list(keep_ids)}")

          # 3. 删除其余所有
          deleted = 0
          for r in all_runs:
              if r["id"] in keep_ids:
                  continue
              if "cleanup-runs" in r["name"]:
                  continue  # 跳过自身
              result = api(f"https://api.github.com/repos/{repo}/actions/runs/{r['id']}", method="DELETE")
              if result is None:
                  deleted += 1
                  print(f"  已删除: {r['id']} ({r['name'][:30]})")
              else:
                  print(f"  失败: {r['id']} {result}")

          print(f"\n完成：删除 {deleted} 个，保留 {len(keep_ids)} 个")
          print("请删除 .github/workflows/cleanup-runs.yml")
          PYEOF
